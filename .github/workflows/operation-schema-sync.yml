name: Operation schema sync

on:
  push:
    branches:
      - feat/operation-091

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[schema-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/operation-091
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install
      - name: Sync exact canonical schema
        env:
          STARINTEL_SCHEMA_REF: f5149e9d16272d1c5c56e8fc06d8298a9b504a08
          STARINTEL_BASE_SCHEMA_REF: f5149e9d16272d1c5c56e8fc06d8298a9b504a08
          STARINTEL_EXPANSION_REF: f5149e9d16272d1c5c56e8fc06d8298a9b504a08
        run: npm run sync-schema
      - name: Commit synced schema bundle and lockfile
        run: |
          if git diff --quiet -- schema package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema package-lock.json
          git commit -m "chore(schema): sync operation contract [schema-sync]"
          git push origin HEAD:feat/operation-091
