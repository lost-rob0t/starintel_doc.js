name: StarIntel conformance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate canonical schema lock
        run: |
          test "$(jq -r .canonical_repository schema/starintel-schema.lock.json)" = "lost-rob0t/starintel-gpt-auto-dig"
          test "$(jq -r .release_version schema/starintel-schema.lock.json)" = "0.9.1"
          jq -e '.required_dtypes | index("research-node") != null' schema/starintel-schema.lock.json > /dev/null
          jq -e '.required_dtypes | index("operation") != null' schema/starintel-schema.lock.json > /dev/null

      - name: Read canonical schema lock
        id: schema-lock
        run: echo "commit=$(jq -r .canonical_commit schema/starintel-schema.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned conformance source
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-gpt-auto-dig
          ref: ${{ steps.schema-lock.outputs.commit }}
          path: conformance-source

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and materialize lockfile
        run: |
          mkdir -p artifacts
          npm install
          cp package-lock.json artifacts/package-lock.json

      - name: Synchronize canonical schema bundle
        run: |
          npm run sync-schema
          npm run check-schema

      - name: Require clean canonical bundle
        run: git diff --exit-code -- schema/starintel-doc-v0.9.0.schema.json schema/starintel-doc-v0.9.0.expansion.json schema/starintel-doc-v0.9.0.manifest.json

      - name: Run JavaScript tests
        env:
          STARINTEL_CONFORMANCE_ROOT: ${{ github.workspace }}/conformance-source
        run: npm test

      - name: Run JavaScript fixture suite
        working-directory: conformance-source
        run: |
          python -m conformance.runner test \
            --producer js \
            --consumer js \
            --adapter "js=node $GITHUB_WORKSPACE/bin/starintel-conformance.js"

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-lockfile
          path: artifacts/package-lock.json
          if-no-files-found: error
