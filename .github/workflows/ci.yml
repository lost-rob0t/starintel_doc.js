name: CI

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: node scripts/sync-schema.mjs --check
      - run: npm test
      - run: npm pack --dry-run
